<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Išmokų skaičiuoklės</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#EDF1F0;--surface:#FFFFFF;--ink:#12201E;--muted:#5A6866;--line:#D9E1DF;--accent:#0B6B63;--accent-soft:#DDEFEC}
@media (prefers-color-scheme:dark){:root{--bg:#0D1514;--surface:#151F1D;--ink:#E6EEEC;--muted:#98A8A5;--line:#283633;--accent:#3DB8AB;--accent-soft:#16332F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif;padding:48px max(16px,env(safe-area-inset-left,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:800 clamp(26px,4vw,34px)/1.15 Manrope,"Segoe UI",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
p{margin:0;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px}
a.card{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card b{font:800 18px Manrope,"Segoe UI",system-ui,sans-serif}
a.card span{color:var(--muted);font-size:14px}
a.card em{font-style:normal;color:var(--accent);font-weight:600;margin-top:6px}
</style>
</head>
<body>
<main>
  <h1>Išmokų skaičiuoklės</h1>
  <p>Palyginimas, kiek lieka į rankas, kai suma mokama per darbo užmokestį, mažąją bendriją ar individualią veiklą.</p>
  <div class="list">
    <a class="card" href="skaiciuokle.html"><b>Išmokų palyginimas</b><span>Darbo užmokestis, MB ir IV</span><em>Atidaryti</em></a>
    <a class="card" href="skaiciuokle-akcijos.html"><b>Išmokų palyginimas su akcijomis</b><span>Papildomai dividendai pagal privilegijuotas akcijas</span><em>Atidaryti</em></a>
  </div>
</main>
</body>
</html>
